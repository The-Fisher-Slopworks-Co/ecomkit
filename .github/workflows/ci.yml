name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unused code
        run: bun run knip

      - name: Run tests
        run: bun run test

  smoke:
    name: Bundle on ${{ matrix.runtime }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            version: "20.19.0"
          - runtime: node
            version: "22"
          - runtime: bun
            version: from package.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node' && matrix.version || '22' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack and install like a user
        working-directory: apps/ecom
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/ecom" "$RUNNER_TEMP"/slopworks-ecomkit-*.tgz
          echo "ECOM_BUNDLE=$RUNNER_TEMP/ecom/lib/node_modules/@slopworks/ecomkit/dist/ecom.js" >> "$GITHUB_ENV"

      - name: Smoke test
        run: bun run smoke
        env:
          ECOM_RUNTIME: ${{ matrix.runtime }}
