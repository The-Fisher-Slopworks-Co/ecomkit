pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: lint
      glob: "*.{ts,mjs}"
      run: bunx oxlint {staged_files}

    - name: format
      glob: "*.{ts,mjs,json,md,yml,yaml}"
      run: bunx prettier --check {staged_files}

    - name: knip
      run: bun run knip

    - name: reuse
      run: bun run reuse

    - name: test
      run: bun run test
